# ─── squid.conf ──────────────────────────────────────────────────────
# Default-deny outbound policy. dstdomain (exact match) is the primary
# mechanism; dstdom_regex is used only for the individually-justified
# exception below, anchored, with its own comment.
#
# The regex exception lives under its own ACL name (allowed_cdn_domains),
# not folded into allowed_domains: Squid treats reusing an ACL name with
# a different acl type as a fatal config error ("already exists with
# different type") and refuses to start — discovered the hard way when
# the first real dstdom_regex entry was added under "allowed_domains"
# and every access-log-based test failed, not just the new ones (issue
# #32). http_access ORs the two names via separate allow lines instead.
# ─────────────────────────────────────────────────────────────────────

http_port 3128

# Docker tracks this container's process directly; no PID file is needed,
# and /run/squid.pid is not writable by the non-root "proxy" user (see SDD
# §6.4, §9 — confirmed empirically during smoke testing, not assumed).
pid_filename none

# ── Core tier — required for basic toolchain operation ────────────────
acl allowed_domains dstdomain api.anthropic.com
# Claude Code's own service endpoint — distinct from api.anthropic.com.
# Confirmed required by a live 403 denial during a real session; the
# original guide's allowlist only ever listed api.anthropic.com.
acl allowed_domains dstdomain platform.claude.com
acl allowed_domains dstdomain registry.npmjs.org
acl allowed_domains dstdomain pypi.org
acl allowed_domains dstdomain files.pythonhosted.org
acl allowed_domains dstdomain github.com
acl allowed_domains dstdomain api.github.com
acl allowed_domains dstdomain codeload.github.com
acl allowed_domains dstdomain raw.githubusercontent.com

# ── Reference tier — authoritative, low-UGC documentation only ────────
# Curated per SDD §3. Stack Overflow and similar UGC sites are
# deliberately excluded — see docs/designs/squid-proxy-integration.md §3.
acl allowed_domains dstdomain docs.python.org
acl allowed_domains dstdomain nodejs.org
acl allowed_domains dstdomain developer.mozilla.org
# Official Claude Code / Anthropic docs — see issue #32. Both are
# Mintlify-hosted; their static assets (JS/CSS/fonts/search index) are
# served from mintcdn.com, not from these domains themselves, so the
# dstdom_regex exception below is required alongside these two entries.
acl allowed_domains dstdomain docs.anthropic.com
acl allowed_domains dstdomain code.claude.com

# systems profile
acl allowed_domains dstdomain en.cppreference.com
acl allowed_domains dstdomain cmake.org

# crypto profile
acl allowed_domains dstdomain www.openssl.org

# research profile
acl allowed_domains dstdomain ctan.org
acl allowed_domains dstdomain tug.org

# ── Planning-research tier — swe-prior-art-research primary sources ───
# Retrieval targets for the one research skill wired into the ADR 002
# planning-artifact contract (it owns docs/planning/prior-art.md). Its
# primary/technical source tier is papers, RFCs, and standards; none of
# it was reachable before, so WebFetch against a cited source was
# refused at the proxy while WebSearch (server-side, never transits this
# container — see auto-memory-seeding-step-zero.md F-6) still returned
# results. Discovery worked and retrieval did not. See issue #91.
#
# Deliberately excludes HN, Stack Overflow, Reddit, LinkedIn and X: the
# skill's own source hierarchy treats community signal as qualitative-
# only, never authoritative, and WebSearch snippets already surface that
# tier without a local fetch. Also excludes dl.acm.org and
# ieeexplore.ieee.org — both paywalled, so a fetch retrieves a landing
# page, which is surface widened for no retrieval value. Widen only
# against a specific cited failure, not preemptively.
acl allowed_domains dstdomain arxiv.org
acl allowed_domains dstdomain datatracker.ietf.org
# Canonical RFC publisher. datatracker.ietf.org also serves RFC text, but
# citations overwhelmingly point here, and a denied apex is invisible to
# WebFetch — it cannot report a redirect it was never allowed to open.
# Bare rfc-editor.org is not included: it resolves to the same Cloudflare
# addresses and redirects to the www host, so entries for both would be
# two ACL lines for one destination.
acl allowed_domains dstdomain www.rfc-editor.org

# ── dstdom_regex exceptions ─────────────────────────────────────────
# Reserved for individually-justified, anchored patterns only — e.g. a
# registry's rotating CDN-edge subdomain that a flat list can't track.
# Own ACL name (not allowed_domains) — see header comment on why.
#
# mintcdn.com — CDN host for docs.anthropic.com and code.claude.com's
# static assets (JS/CSS/fonts/search index). Both sites are Mintlify-
# hosted; a flat dstdomain entry for the page domains alone does not
# cover this. Anchored to mintcdn.com and any of its subdomains only.
# See issue #32.
acl allowed_cdn_domains dstdom_regex ^([a-z0-9-]+\.)*mintcdn\.com$

# ── Access policy ───────────────────────────────────────────────────
acl CONNECT method CONNECT
http_access allow CONNECT allowed_domains
http_access allow CONNECT allowed_cdn_domains
http_access allow allowed_domains
http_access allow allowed_cdn_domains
http_access deny all

# ── Logging ─────────────────────────────────────────────────────────
# "squid" (native format, e.g. TCP_TUNNEL/200) — not "combined" (NCSA
# format, e.g. TCP_TUNNEL:HIER_DIRECT). Confirmed empirically after a
# bats S-1/S-3 failure traced to this exact format mismatch.
access_log stdio:/dev/stdout squid

# ── Privacy and cache ───────────────────────────────────────────────
cache deny all
forwarded_for off
via off
