# ci.yml — the repository's first automated gate.
#
# Scope, stated explicitly so nobody mistakes it for more than it is:
# this job runs ONLY the tests tagged `hostonly` — those that need no
# container engine and no pre-built image. Today that is:
#   - tests/test_config.bats              (layered config precedence)
#   - tests/test_docs_integrity.bats      (documentation integrity)
#   - tests/test_planning_artifacts.bats  (ADR 002 artifact contract)
#   - tests/test_control_declarations.bats (security controls declared
#                                           where the thing that reads
#                                           them looks — SDD §4.9)
#
# NOT covered here, and still runnable only on a developer machine with
# Podman and built images:
#   - tests/test_squid_isolation.bats   (egress policy)
#   - tests/test_toolchain_smoke.bats   (per-profile toolchains)
#   - tests/test_global_layer.bats      (global layer injection)
#   - tests/test_build.bats             (image builds)
#   - tests/test_runtime_posture.bats   (container runtime flags)
#
# That is a deliberate trade, not an oversight: a gate whose scope is
# documented is a tool, an undocumented one is a trap. Building four images
# on every push would make this slow and flaky enough that it would end up
# ignored or disabled, which is worse than a narrow gate that always runs.
# Extending coverage to the slow tier is a separate decision.
#
# One distinction this list must not be read as erasing. The
# control-declarations group asserts that a security control is *declared*
# at the path that reads it. It does not assert that the control is *in
# force* — no test in this job starts a container, so none of them can.
# Every control in the security plan's §5 STRIDE map is still enforced only
# as far as the tests above, which do not run here, establish. A green check
# on this job means the declarations survived; it has never meant more.
#
# The two numbers that say whether this job did what it claims — how many
# tests were selected, and how many passed — are published twice, to two
# audiences. Run logs are served from hosts outside the sandbox's egress
# allowlist, so from inside a session the log is the one place this evidence
# cannot be read (#113).
#
#   - the job summary, for a person reading the run in the browser;
#   - a `::notice::` annotation, because that is what the REST API actually
#     exposes. Measured, not assumed: on run 37482258723 the job summary was
#     populated and `check-runs/<id>` returned `output.summary` empty, while
#     `check-runs/<id>/annotations` returned its contents. Writing only to
#     the summary would have left #113's gap exactly where it was while
#     looking like it had been closed.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  hostonly:
    name: Host-only tests (no container engine)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install bats-core
        # Upstream install rather than the distro package, matching the
        # distro-independent instruction in BUILDING.md so CI and a local
        # run exercise the same bats version semantics.
        #
        # Pinned to the same commit as base/Dockerfile's BATS_COMMIT. An
        # unpinned clone of the default branch meant the version behind a
        # given green run was never recorded, and the gate could change
        # under us whenever upstream moved. D-10 asserts these two agree;
        # change both or the check fails.
        env:
          BATS_VERSION: v1.14.0
          BATS_COMMIT: eb7f42f8d608ac693d7a4b67474f6714ea68cfc5
        run: |
          git clone --depth 1 --branch "$BATS_VERSION" \
            https://github.com/bats-core/bats-core.git /tmp/bats-core
          cd /tmp/bats-core
          test "$(git rev-parse HEAD)" = "$BATS_COMMIT"
          sudo ./install.sh /usr/local
          cd -
          bats --version

      - name: Guard the test selection against shrinking
        # A mistyped or renamed tag makes `--filter-tags` select zero tests
        # and exit 0 — a green check that asserts nothing, which is exactly
        # the failure mode this whole workflow exists to prevent elsewhere.
        # The floor extends that to the subtler case: a test moved into a
        # file whose setup() gates on a container engine also leaves this
        # job green while silently dropping out of it, which is how G-6 and
        # B-4 went uncovered for four weeks (#81).
        env:
          HOSTONLY_FLOOR: 49
        run: |
          count=$(bats --filter-tags hostonly --count tests/)
          echo "hostonly tests selected: ${count} (floor ${HOSTONLY_FLOOR})"
          # Published to the job summary as well as the log, because the log
          # is where this number is unreadable from. Run logs are served
          # from hosts outside the sandbox's egress allowlist, so a session
          # that adds a check can verify its logic locally and cannot
          # confirm the check was selected and executed (#113). The summary
          # reaches api.github.com, which is allowlisted.
          echo "- hostonly tests selected: **${count}** (floor ${HOSTONLY_FLOOR})" \
            >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=hostonly selection::selected ${count}, floor ${HOSTONLY_FLOOR}"
          if [ "${count}" -lt "${HOSTONLY_FLOOR}" ]; then
            echo "::error::Selected ${count} hostonly tests, below the floor of ${HOSTONLY_FLOOR}. Either the tag broke, or a test moved into a file whose setup() gates on an engine. Lower the floor only when tests are deliberately removed." >&2
            echo "- **selection is below the floor** — the gate did not run what it claims to" \
              >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Run host-only tests
        # The counts go to the summary whether the run passes or fails, and
        # the step's exit status is bats', not tee's. A failing run that
        # reported nothing retrievable would leave a session exactly where
        # #113 describes: knowing only that something is red.
        run: |
          tap="${RUNNER_TEMP}/hostonly.tap"
          set +e
          bats --filter-tags hostonly --print-output-on-failure tests/ | tee "$tap"
          status=${PIPESTATUS[0]}
          set -e
          # Anchored on the TAP result number. An unanchored '^ok ' also
          # matches any captured output line that happens to start that way,
          # and --print-output-on-failure means captured output is present
          # exactly when the counts matter. A count that is wrong only on
          # failure is worse than no count, because it is trusted.
          passed=$(grep -cE '^ok [0-9]+' "$tap" || true)
          failed=$(grep -cE '^not ok [0-9]+' "$tap" || true)
          echo "- hostonly tests run: **${passed} passed, ${failed} failed**" \
            >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=hostonly result::${passed} passed, ${failed} failed"
          if [ "${failed}" -ne 0 ]; then
            {
              echo
              echo '```'
              grep '^not ok ' "$tap"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"
